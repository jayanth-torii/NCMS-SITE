<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="NCMS environment variables visual">
  <rect width="900" height="260" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#000000">ENVIRONMENT MAP</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000">
    <rect x="70" y="70" width="300" height="128" rx="16" fill="#f6f9ff" stroke="#dbe5f5"/>
    <text x="96" y="102" font-size="17" font-weight="800">ncms-web-main/.env</text>
    <rect x="96" y="122" width="220" height="24" rx="7" fill="#ffffff" stroke="#0e2455"/>
    <text x="108" y="139" font-size="12">NEXT_PUBLIC_API_URL</text>
    <text x="96" y="170" font-size="13">Browser fetches API base URL</text>
    <rect x="530" y="70" width="300" height="128" rx="16" fill="#fff6ee" stroke="#f6d9bb"/>
    <text x="556" y="102" font-size="17" font-weight="800">ncms-backend-main/.env</text>
    <text x="556" y="130" font-size="12">PORT, MONGO_URI, JWT_SECRET</text>
    <text x="556" y="152" font-size="12">WEB_PUBLIC_DIR, DATA_EXPORT_PATH</text>
    <text x="556" y="174" font-size="12">ADMIN_EMAIL, ADMIN_PASSWORD</text>
    <path d="M370 134 H530" stroke="#F6872A" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 10">
      <animate attributeName="stroke-dashoffset" values="0;-44" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="NCMS project overview visual">
  <defs>
    <linearGradient id="overviewLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e2455"/>
      <stop offset="100%" stop-color="#F6872A"/>
    </linearGradient>
  </defs>
  <rect width="900" height="260" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#000000">PROJECT OVERVIEW</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M220 130 H680" stroke="url(#overviewLine)" stroke-width="5" stroke-linecap="round" stroke-dasharray="18 12">
      <animate attributeName="stroke-dashoffset" values="0;-60" dur="2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(80 74)">
      <rect width="180" height="116" rx="16" fill="#f6f9ff" stroke="#dbe5f5"/>
      <circle cx="44" cy="42" r="18" fill="#0e2455"/>
      <path d="M34 42 h20 M44 32 v20" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="42" font-size="17" font-weight="800" fill="#000000">Website</text>
      <text x="82" y="66" font-size="13" fill="#000000">Next.js :3100</text>
      <text x="22" y="96" font-size="12" fill="#000000">25+ public pages</text>
    </g>
    <g transform="translate(360 74)">
      <rect width="180" height="116" rx="16" fill="#fff6ee" stroke="#f6d9bb"/>
      <circle cx="44" cy="42" r="18" fill="#F6872A"/>
      <path d="M35 42 h18 M44 33 v18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="42" font-size="17" font-weight="800" fill="#000000">API</text>
      <text x="82" y="66" font-size="13" fill="#000000">Express :4001</text>
      <text x="22" y="96" font-size="12" fill="#000000">MongoDB + seed data</text>
    </g>
    <g transform="translate(640 74)">
      <rect width="180" height="116" rx="16" fill="#f6f9ff" stroke="#dbe5f5"/>
      <circle cx="44" cy="42" r="18" fill="#0e2455"/>
      <path d="M35 52 c4-14 22-14 26 0" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="48" cy="37" r="6" fill="#ffffff"/>
      <text x="82" y="42" font-size="17" font-weight="800" fill="#000000">Admin</text>
      <text x="82" y="66" font-size="13" fill="#000000">React :3001</text>
      <text x="22" y="96" font-size="12" fill="#000000">Content editor</text>
    </g>
    <circle r="7" fill="#F6872A">
      <animateMotion path="M220 130 H680 H220" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

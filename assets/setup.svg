<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" role="img" aria-label="NCMS getting started visual">
  <rect width="900" height="250" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#000000">GETTING STARTED FLOW</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000">
    <path d="M210 126 H690" stroke="#0e2455" stroke-width="4" stroke-linecap="round" stroke-dasharray="16 12">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(80 78)">
      <circle cx="60" cy="48" r="42" fill="#fff6ee" stroke="#F6872A" stroke-width="2"/>
      <text x="60" y="43" text-anchor="middle" font-size="18" font-weight="900">1</text>
      <text x="60" y="66" text-anchor="middle" font-size="12">WEB :3100</text>
    </g>
    <g transform="translate(390 78)">
      <circle cx="60" cy="48" r="42" fill="#f6f9ff" stroke="#0e2455" stroke-width="2"/>
      <text x="60" y="43" text-anchor="middle" font-size="18" font-weight="900">2</text>
      <text x="60" y="66" text-anchor="middle" font-size="12">API :4001</text>
    </g>
    <g transform="translate(700 78)">
      <circle cx="60" cy="48" r="42" fill="#fff6ee" stroke="#F6872A" stroke-width="2"/>
      <text x="60" y="43" text-anchor="middle" font-size="18" font-weight="900">3</text>
      <text x="60" y="66" text-anchor="middle" font-size="12">ADMIN :3001</text>
    </g>
    <circle r="8" fill="#F6872A">
      <animateMotion path="M210 126 H690 H210" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>

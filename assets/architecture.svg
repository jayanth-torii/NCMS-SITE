  <rect x="0" y="0" width="900" height="380" rx="18" fill="#ffffff"/>

  <text x="450" y="36" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="900" fill="#000000" letter-spacing="3">SYSTEM ARCHITECTURE</text>

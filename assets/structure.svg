      <text x="24" y="31" font-size="16" font-weight="800">ncms-backend-main</text>
      <text x="24" y="55" font-size="13">routes, models</text>
      <text x="24" y="76" font-size="13">seed, controllers</text>
    </g>
    <g transform="translate(590 154)">
      <rect width="240" height="92" rx="14" fill="#f6f9ff" stroke="#dbe5f5"/>
      <text x="24" y="31" font-size="16" font-weight="800">ncms-admin-main</text>
      <text x="24" y="55" font-size="13">dashboard, auth</text>
      <text x="24" y="76" font-size="13">content editor</text>

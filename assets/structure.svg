<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-label="NCMS project structure visual">
  <rect width="900" height="300" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#000000">MONOREPO STRUCTURE</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000">
    <rect x="360" y="58" width="180" height="42" rx="12" fill="#fff6ee" stroke="#F6872A"/>
    <text x="450" y="84" text-anchor="middle" font-size="15" font-weight="800">ncms-new</text>
    <path d="M450 100 V130 M190 130 H710 M190 130 V154 M450 130 V154 M710 130 V154" stroke="#0e2455" stroke-width="3" fill="none" stroke-dasharray="8 8">
      <animate attributeName="stroke-dashoffset" values="0;-32" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(70 154)">

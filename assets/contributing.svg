<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" role="img" aria-label="NCMS contributing workflow visual">
  <rect width="900" height="240" rx="18" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="800" fill="#000000">CONTRIBUTION FLOW</text>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#000000" font-size="13" font-weight="800">
    <path d="M175 122 H725" stroke="#0e2455" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 10">
      <animate attributeName="stroke-dashoffset" values="0;-48" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <g><circle cx="120" cy="122" r="38" fill="#fff6ee" stroke="#F6872A"/><text x="120" y="118" text-anchor="middle">Fork</text><text x="120" y="137" text-anchor="middle" font-size="11">repo</text></g>
    <g><circle cx="285" cy="122" r="38" fill="#f6f9ff" stroke="#0e2455"/><text x="285" y="118" text-anchor="middle">Branch</text><text x="285" y="137" text-anchor="middle" font-size="11">feature</text></g>
    <g><circle cx="450" cy="122" r="38" fill="#fff6ee" stroke="#F6872A"/><text x="450" y="118" text-anchor="middle">Commit</text><text x="450" y="137" text-anchor="middle" font-size="11">changes</text></g>
    <g><circle cx="615" cy="122" r="38" fill="#f6f9ff" stroke="#0e2455"/><text x="615" y="118" text-anchor="middle">Push</text><text x="615" y="137" text-anchor="middle" font-size="11">origin</text></g>
    <g><circle cx="780" cy="122" r="38" fill="#fff6ee" stroke="#F6872A"/><text x="780" y="118" text-anchor="middle">PR</text><text x="780" y="137" text-anchor="middle" font-size="11">review</text></g>
  </g>
</svg>
